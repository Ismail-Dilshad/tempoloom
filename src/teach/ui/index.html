<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Tempoloom</title>
<link rel="icon" href="/favicon.svg?v=10" type="image/svg+xml">
<script>try{if(localStorage.getItem('tl-rail')==='"collapsed"')document.documentElement.dataset.rail='collapsed';}catch{}</script>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/shell.css">
</head>
<body>
<div class="shell app" id="app">
 <aside class="rail side" id="side" aria-label="Places"></aside>
 <div class="scrim" id="scrim"></div>
 <header class="topbar" id="topbar">
  <div class="tb-left"><button class="iconbtn menu" id="menu" aria-label="Open the menu"></button><h1 class="tb-title" id="title"></h1><span id="page-menu"></span></div>
  <div class="tb-right"><div class="tb-actions" id="actions"></div><div class="row" id="tb-icons" style="gap:4px;flex-wrap:nowrap"></div></div>
 </header>
 <main class="canvas main" id="canvas"><div class="view" id="view" tabindex="-1"></div></main>
 <aside class="panel" id="panel" hidden aria-labelledby="panel-title"></aside>
 <div id="dock-slot"></div>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div id="pop-slot"></div>
<div id="overlay-slot"></div>
<div id="modal"></div>
<script src="/core.js"></script>
<script src="/shell.js"></script>
<script src="/taste.js"></script>
<script src="/teach.js"></script>
<script src="/learned.js"></script>
<script src="/script.js"></script>
<script src="/studio.js"></script>
<script src="/gallery.js"></script>
<script src="/live.js"></script>
<script src="/settings.js"></script>
<script src="/backup.js"></script>
<script src="/ideas.js"></script>
<script src="/history.js"></script>
<script src="/text.js"></script>
<script src="/find.js"></script>
<script src="/create.js"></script>
<script src="/places.js"></script>
<script src="/icons.js"></script>
<script>App.start();</script>
</body>
</html>
